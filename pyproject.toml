[project]
name = "epochmem"
version = "0.1.0"
description = "Benchmark for read-after-write staleness in asynchronous agent memory pipelines."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "confluent-kafka>=2.5",
    "redis>=5.0",
    "psycopg[binary]>=3.2",
    "tiktoken>=0.7",
    "mem0ai==1.0.11",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/epochmem"]

[tool.pytest.ini_options]
testpaths = ["tests"]
